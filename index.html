<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kabadiwala — H.F Traders</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    /* Hero Section */
    .hero {
      background: url('hero-banner-BraDHLZK.jpg') no-repeat center center/cover;
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4); /* overlay */
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 20px;
      max-width: 1000px;
    }

    .hero .brand {
      font-size: 3rem;
      font-weight: bold;
      margin: 0;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero .tagline {
      font-size: 1.5rem;
      margin: 15px 0;
      font-style: italic;
      color: #f7dd88;
    }

    .hero .subtitle {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .hero .address {
      font-size: 1rem;
      margin: 10px 0;
    }

    .contacts {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .contact-item {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .contact-item a {
      color: #fff;
      text-decoration: none;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Hero Banner Section -->
  <header class="hero" role="banner" aria-label="Hero banner — H.F Traders">
    <div class="hero-inner">
      <h1 class="brand">H.F TRADERS</h1>
      <div class="tagline">Turning Waste into Worth Since 1974</div>

      <div class="subtitle">Scrap Merchant / Waste Management</div>
      <div class="address">
        Sanjay Camp, Singapore Embassy, Chanakyapuri, New Dkl, Delhi 10021
      </div>

      <div class="contacts" aria-label="Contact information">
        <div class="contact-item">📞 99586 54732</div>
        <div class="contact-item">📷 @hftraders_official</div>
        <div class="contact-item">
          📧 <a href="mailto:hftraders121@gmail.com">hftraders121@gmail.com</a>
        </div>
      </div>
    </div>
  </header>

</body>
</html>
