<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H.F Traders - Premium Scrap Merchant Delhi NCR</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
      background: #111;
    }

    /* Hero Section - Full Screen */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    /* Dynamic Background with Parallax */
    .hero-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(135deg, 
          rgba(0,0,0,0.95) 0%, 
          rgba(20,40,30,0.85) 50%, 
          rgba(0,20,10,0.9) 100%),
        url('https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transform: scale(1.1);
      animation: slowZoom 20s infinite alternate;
      z-index: 1;
    }

    @keyframes slowZoom {
      0% { transform: scale(1.1); }
      100% { transform: scale(1.2); }
    }

    /* Animated Overlay Particles */
    .overlay-particles {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 50%, rgba(255,215,0,0.1) 0%, transparent 50%);
      z-index: 2;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* Floating Metal Particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 215, 0, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      animation: float 6s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    /* Main Content */
    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      padding: 2rem;
      animation: fadeInUp 1.2s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Premium Badge */
    .est-badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      margin-bottom: 2rem;
      color: #ffd966;
      font-weight: 500;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .est-badge i {
      margin-right: 8px;
      color: #ffd700;
    }

    /* Main Title with 3D Effect */
    .hero-title {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -2px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    .hero-title .line1 {
      display: block;
      background: linear-gradient(135deg, #fff 0%, #ffd966 50%, #fff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s infinite;
    }

    .hero-title .line2 {
      display: block;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      letter-spacing: 4px;
      color: #ffd966;
      text-shadow: 0 2px 10px rgba(255,215,0,0.3);
      margin-top: 0.5rem;
    }

    @keyframes shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Tagline with Icon */
    .tagline {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      margin: 2rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      color: rgba(255,255,255,0.95);
    }

    .tagline i {
      color: #ffd966;
      font-size: 2rem;
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Address Card */
    .address-card {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      padding: 1.2rem 2rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      margin: 2rem 0;
      font-size: 1.1rem;
      border-left: 4px solid #ffd966;
      box-shadow: 0 20px 40px -15px black;
    }

    .address-card i {
      color: #ffd966;
      font-size: 1.3rem;
    }

    /* Contact Grid */
    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin: 3rem 0;
    }

    .contact-item {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1.2rem 2rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      transition: all 0.3s ease;
      min-width: 220px;
    }

    .contact-item:hover {
      transform: translateY(-5px);
      border-color: #ffd966;
      background: rgba(255, 215, 0, 0.1);
      box-shadow: 0 15px 30px -10px #ffd966;
    }

    .contact-item i {
      font-size: 1.5rem;
      color: #ffd966;
      margin-right: 12px;
      width: 30px;
    }

    .contact-item a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    .contact-item a:hover {
      color: #ffd966;
    }

    /* CTA Buttons */
    .cta-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .btn {
      padding: 1.2rem 3rem;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffd966, #ffb347);
      color: #000;
      box-shadow: 0 10px 20px -5px #ffb347;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 30px -5px #ffb347;
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid rgba(255, 215, 0, 0.5);
      color: white;
      backdrop-filter: blur(5px);
    }

    .btn-secondary:hover {
      border-color: #ffd966;
      background: rgba(255, 215, 0, 0.1);
      transform: translateY(-3px);
    }

    /* Stats Section */
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3rem;
      margin-top: 4rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffd966;
      display: block;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.7);
    }

    /* Scroll Indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      animation: bounce 2s infinite;
    }

    .scroll-indicator i {
      color: #ffd966;
      font-size: 2rem;
      opacity: 0.7;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .contact-grid {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      
      .contact-item {
        width: 100%;
        max-width: 350px;
      }
      
      .address-card {
        flex-direction: column;
        text-align: center;
        padding: 1.5rem;
        border-radius: 30px;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
      
      .stats {
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <!-- Dynamic Background -->
    <div class="hero-background"></div>
    <div class="overlay-particles"></div>
    
    <!-- Floating Particles (generated with JS) -->
    <div id="particles"></div>

    <!-- Main Content -->
    <div class="hero-content">
      <!-- Established Badge -->
      <div class="est-badge">
        <i class="fas fa-calendar-alt"></i> EST. 1974 · 50+ YEARS OF TRUST
      </div>

      <!-- Title -->
      <h1 class="hero-title">
        <span class="line1">H.F TRADERS</span>
        <span class="line2">Turning Waste into Worth</span>
      </h1>

      <!-- Tagline -->
      <div class="tagline">
        <i class="fas fa-recycle"></i>
        <span>Premium Scrap Merchant · Waste Management Experts</span>
        <i class="fas fa-industry"></i>
      </div>

      <!-- Address Card -->
      <div class="address-card">
        <i class="fas fa-map-marker-alt"></i>
        <span>Sanjay Camp, Singapore Embassy, Chanakyapuri, New Delhi - 10021</span>
      </div>

      <!-- Contact Information Grid -->
      <div class="contact-grid">
        <!-- Phone -->
        <div class="contact-item">
          <i class="fas fa-phone-alt"></i>
          <a href="tel:+919958654732">+91 99586 54732</a>
        </div>
        
        <!-- Email -->
        <div class="contact-item">
          <i class="fas fa-envelope"></i>
          <a href="mailto:hftraders121@gmail.com">hftraders121@gmail.com</a>
        </div>
        
        <!-- Instagram -->
        <div class="contact-item">
          <i class="fab fa-instagram"></i>
          <a href="https://instagram.com/hftraders_official" target="_blank">@hftraders_official</a>
        </div>
      </div>

      <!-- Call to Action Buttons -->
      <div class="cta-buttons">
        <button class="btn btn-primary" onclick="window.location.href='tel:+919958654732'">
          <i class="fas fa-truck"></i> Free Pickup
        </button>
        <button class="btn btn-secondary" onclick="window.location.href='mailto:hftraders121@gmail.com'">
          <i class="fas fa-file-invoice"></i> Get Quote
        </button>
      </div>

      <!-- Trust Stats -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number">50+</span>
          <span class="stat-label">Years Experience</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">10K+</span>
          <span class="stat-label">Happy Clients</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">24/7</span>
          <span class="stat-label">Service</span>
        </div>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <i class="fas fa-chevron-down"></i>
    </div>
  </section>

  <script>
    // Generate floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const numberOfParticles = 30;
      
      for (let i = 0; i < numberOfParticles; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random position
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        
        // Random size
        const size = Math.random() * 10 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        
        // Random animation delay
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.animationDuration = Math.random() * 10 + 10 + 's';
        
        // Random opacity
        particle.style.opacity = Math.random() * 0.3;
        
        particlesContainer.appendChild(particle);
      }
    }
    
    createParticles();

    // Smooth scroll for indicator
    document.querySelector('.scroll-indicator').addEventListener('click', () => {
      window.scrollTo({
        top: window.innerHeight,
        behavior: 'smooth'
      });
    });

    // Fix for mobile vh
    const setHeroHeight = () => {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      document.querySelector('.hero').style.height = `calc(var(--vh, 1vh) * 100)`;
    };

    setHeroHeight();
    window.addEventListener('resize', setHeroHeight);
    window.addEventListener('orientationchange', setHeroHeight);
  </script>
</body>
</html>
